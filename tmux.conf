# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %
# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# switch panes with prefix + vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with prefix + shift+vim keys
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# switch windows with prefix + ctrl+vim keys
bind C-l select-window -n
bind C-h select-window -p

# Eliminate escape-key delay (prefix + C-[ enters copy-mode instantly)
set -sg escape-time 0

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set-option -g allow-rename off

# Fix copy paste
set-window-option -g mode-keys vi
bind-key C-[ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Needed for pi agent harness
set -g extended-keys on

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf
